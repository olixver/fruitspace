<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Famous Baby</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Famous Baby">
<meta name="theme-color" content="#e8578a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { background: #fff3f6; }
@media (prefers-color-scheme: dark) { html { background: #1a0f14; } }
body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<style>
/* Layout: one-screen app. Red-carpet stage with the baby, one big play button below. */
:root {
  --bg: #fff3f6; --surface: #ffffff; --fg: #2a1820; --muted: #7d5a68;
  --pink: #e8578a; --gold: #d9a21b; --line: #f3d3de; --carpet: #c2304f;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a0f14; --surface: #26161d; --fg: #fbe9ef; --muted: #c49aab;
  --pink: #ff7ca8; --gold: #f2c343; --line: #3d2530; --carpet: #8f1f38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a0f14; --surface: #26161d; --fg: #fbe9ef; --muted: #c49aab;
  --pink: #ff7ca8; --gold: #f2c343; --line: #3d2530; --carpet: #8f1f38; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; text-align: center; }
.eyebrow { font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; color: var(--gold); margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 10vw, 3.4rem); line-height: 1; margin: 2px 0 0; color: var(--pink); text-wrap: balance; }
.stage { position: relative; border-radius: 24px; overflow: hidden; padding-block: 24px 0;
  background: radial-gradient(circle at 50% 30%, var(--surface), var(--line)); border: 1px solid var(--line); }
.stage::after { content: ""; display: block; height: 44px; background: var(--carpet); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
.babyBtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 50%; }
.babyBtn:focus-visible { outline: 4px solid var(--gold); outline-offset: 4px; }
.baby { width: min(220px, 60vw); height: auto; display: block; margin: 0 auto -8px; }
.baby .mouth { transform-origin: 60px 82px; transform: scaleY(.25); transition: transform .08s; }
.singing .baby .mouth { transform: scaleY(1); }
.singing .baby { animation: bob .35s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) rotate(-3deg) } to { transform: translateY(-6px) rotate(3deg) } }
.flash { position: absolute; width: 90px; height: 90px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.7) 30%, rgba(255,255,255,0) 70%); opacity: 0; }
.flash.go { animation: pop .35s ease-out; }
@keyframes pop { 0% { opacity: 1; transform: scale(.4) } 100% { opacity: 0; transform: scale(1.4) } }
@media (prefers-reduced-motion: reduce) { .singing .baby { animation: none } .flash.go { animation: none } }
.bubble { font-family: var(--display); font-size: 1.7rem; color: var(--pink); min-height: 2.8rem; margin: 0; overflow-wrap: anywhere; }
.hint { color: var(--muted); margin: 0; font-size: .95rem; }
#play { font: 800 1.3rem var(--display); border: 0; background: var(--pink); color: var(--surface);
  border-radius: 99px; padding: 12px 40px; cursor: pointer; align-self: center; }
#play:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>

<main>
  <header>
    <p class="eyebrow">Live on the red carpet</p>
    <h1>The Famous Baby</h1>
  </header>

  <section class="stage" id="stage">
    <div class="flash" id="f1" style="left:6%;top:14%"></div>
    <div class="flash" id="f2" style="right:8%;top:30%"></div>
    <div class="flash" id="f3" style="left:16%;top:56%"></div>
    <button class="babyBtn" id="baby" aria-label="Tap the baby to make it sing now">
      <svg class="baby" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M30 24 l8 -16 l8 12 l14 -14 l14 14 l8 -12 l8 16 z" fill="#f2c343" stroke="#c99a12" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="60" cy="66" r="46" fill="#ffd9c2" stroke="#e8b598" stroke-width="3"/>
        <rect x="26" y="48" width="30" height="16" rx="7" fill="#2a1820"/><rect x="64" y="48" width="30" height="16" rx="7" fill="#2a1820"/>
        <rect x="54" y="53" width="12" height="3" fill="#2a1820"/>
        <rect x="31" y="51" width="8" height="3" rx="1.5" fill="#ff7ca8"/><rect x="69" y="51" width="8" height="3" rx="1.5" fill="#ff7ca8"/>
        <circle cx="30" cy="80" r="7" fill="#f7a7bf" opacity=".75"/><circle cx="90" cy="80" r="7" fill="#f7a7bf" opacity=".75"/>
        <ellipse class="mouth" cx="60" cy="86" rx="10" ry="9" fill="#b03a5b"/>
      </svg>
    </button>
  </section>

  <p class="bubble" id="caption" aria-live="polite">…</p>
  <button id="play">Play</button>
  <p class="hint">Turn your sound on. The baby jumps in by itself, or tap the baby to make it sing now.</p>
</main>

<script>
// Same sound engine as Baby Eyes: the waves demo track, with the baby taking over the vocals now and then.
const ODDS = 0.12;
const SYL = [
  { t: "goo", f: [350, 800] }, { t: "ga", f: [800, 1250] }, { t: "bah", f: [750, 1150] },
  { t: "dee", f: [300, 2300] }, { t: "ooo", f: [380, 850] }, { t: "ahh", f: [850, 1300] },
  { t: "mama", f: [700, 1200] }, { t: "bubba", f: [500, 1000] },
];
const $ = id => document.getElementById(id);
let ctx, song = null, src = null, gFull, gKara, playing = false;
let babyUntil = 0, nextRoll = 0, timer = null;

function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
}

function makeDemo() {
  const sr = ctx.sampleRate, barLen = 3, bars = 8, len = Math.floor(sr * barLen * bars);
  const buf = ctx.createBuffer(2, len, sr), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const chords = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]];
  const mel = [64, 67, 69, 67, 64, 60, 62, 64, 65, 64, 62, 60, 62, 64, 67, 62];
  let nl = 0, nr = 0;
  for (let i = 0; i < len; i++) {
    const t = i / sr, b = Math.floor(t / barLen), tb = t - b * barLen, c = chords[b % 4];
    const env = Math.min(1, tb / 0.4) * Math.min(1, (barLen - tb) / 0.4);
    const pad = (m, side) => Math.sin(2 * Math.PI * hz(m) * t * (side ? 1.002 : 0.998)) + 0.2 * Math.sin(6 * Math.PI * hz(m) * t);
    let l = 0.08 * env * (pad(c[0], 0) + pad(c[2] + 12, 0));
    let r = 0.08 * env * (pad(c[1], 1) + pad(c[0] + 12, 1));
    nl = nl * 0.985 + (Math.random() * 2 - 1) * 0.015; nr = nr * 0.985 + (Math.random() * 2 - 1) * 0.015;
    const swell = 0.6 + 0.4 * Math.sin(2 * Math.PI * t / 6);
    l += nl * 1.6 * swell; r += nr * 1.6 * swell;
    const half = barLen / 2, n = Math.floor(t / half), tn = t - n * half, f = hz(mel[n % mel.length]);
    const nenv = Math.min(1, tn / 0.08) * Math.max(0, 1 - tn / half) ** 0.6;
    const ph = 2 * Math.PI * f * t + 0.9 * Math.sin(2 * Math.PI * 5.5 * t);
    const v = 0.16 * nenv * (Math.sin(ph) + 0.3 * Math.sin(2 * ph));
    L[i] = l + v; R[i] = r + v;
  }
  return buf;
}

function stop() {
  if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
  playing = false; clearInterval(timer); babyUntil = 0; setBaby(false); $("play").textContent = "Play";
}

function play() {
  ensureCtx();
  if (!song) song = makeDemo();
  src = ctx.createBufferSource(); src.buffer = song; src.loop = true;
  gFull = ctx.createGain(); gKara = ctx.createGain(); gKara.gain.value = 0;
  src.connect(gFull).connect(ctx.destination);
  const split = ctx.createChannelSplitter(2), inv = ctx.createGain(), sum = ctx.createGain();
  inv.gain.value = -1; sum.gain.value = 0.9;
  src.connect(split); split.connect(sum, 0); split.connect(inv, 1); inv.connect(sum);
  const low = ctx.createBiquadFilter(); low.type = "lowpass"; low.frequency.value = 140;
  src.connect(low).connect(sum);
  sum.connect(gKara).connect(ctx.destination);
  src.start(); playing = true;
  nextRoll = ctx.currentTime + 2; $("play").textContent = "Stop";
  timer = setInterval(tick, 200);
}

function tick() {
  const now = ctx.currentTime;
  if (babyUntil && now >= babyUntil) { babyUntil = 0; setBaby(false); nextRoll = now + 1.5 + Math.random() * 1.5; }
  if (!babyUntil && now >= nextRoll) {
    if (Math.random() < ODDS) startBaby(); else nextRoll = now + 2.5;
  }
}

function startBaby() {
  if (!playing) return;
  const now = ctx.currentTime, dur = 2.5 + Math.random() * 2.5;
  babyUntil = now + dur;
  gFull.gain.setTargetAtTime(0, now, 0.05); gKara.gain.setTargetAtTime(1, now, 0.05);
  setBaby(true);
  paparazzi();
  singSynth(now, dur);
}

function setBaby(on) {
  $("stage").classList.toggle("singing", on);
  if (!on) {
    $("caption").textContent = "…";
    if (gFull && ctx) { const n = ctx.currentTime; gFull.gain.setTargetAtTime(1, n, 0.08); gKara.gain.setTargetAtTime(0, n, 0.08); }
  }
}

function singSynth(t0, dur) {
  const out = ctx.createGain(); out.gain.value = 0.5; out.connect(ctx.destination);
  let t = t0, words = [];
  while (t < t0 + dur - 0.2) {
    const s = SYL[Math.floor(Math.random() * SYL.length)], len = 0.18 + Math.random() * 0.25;
    const osc = ctx.createOscillator(), g = ctx.createGain(), base = 430 + Math.random() * 220;
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.linearRampToValueAtTime(base * (Math.random() < 0.5 ? 1.25 : 0.85), t + len);
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 7; vg.gain.value = 18;
    vib.connect(vg).connect(osc.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.6, t + 0.03); g.gain.setTargetAtTime(0, t + len * 0.7, 0.04);
    s.f.forEach((fq, k) => {
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = fq; bp.Q.value = 6;
      const fg = ctx.createGain(); fg.gain.value = k ? 0.6 : 1.2;
      osc.connect(bp).connect(fg).connect(g);
    });
    g.connect(out);
    osc.start(t); vib.start(t); osc.stop(t + len + 0.2); vib.stop(t + len + 0.2);
    words.push([t, s.t]);
    t += len + 0.05 + Math.random() * 0.12;
  }
  words.forEach(([wt, w]) => setTimeout(() => {
    if (babyUntil) $("caption").textContent = ($("caption").textContent === "…" ? "" : $("caption").textContent + " ").split(" ").slice(-4).join(" ") + w;
  }, Math.max(0, (wt - ctx.currentTime) * 1000)));
}

function paparazzi() {
  ["f1", "f2", "f3"].forEach((id, i) => setTimeout(() => {
    const el = $(id); el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  }, i * 140 + Math.random() * 100));
}

$("play").onclick = () => playing ? stop() : play();
$("baby").onclick = () => { if (!playing) play(); if (!babyUntil) startBaby(); };
</script>

<script>
// Pick the sound back up when you come back to the app.
document.addEventListener("visibilitychange", () => { if (!document.hidden && playing && ctx) ctx.resume(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
